name: Build Windows app and publish release

on:
  push:
    tags: ['v*']        # push a tag like v1.0.0 -> builds the .exe files and attaches them to a GitHub Release
  workflow_dispatch:     # or run it by hand from the Actions tab (files appear as a downloadable artifact)

permissions:
  contents: write        # needed to create the Release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # the app is not code-signed
      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: outreach-mailer-windows
          path: |
            release/Outreach-Mailer-Setup.exe
            release/Outreach-Mailer-Portable.exe
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Outreach-Mailer-Setup.exe
            release/Outreach-Mailer-Portable.exe
          generate_release_notes: true
